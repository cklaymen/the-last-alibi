services:
  api:
    build:
      context: .
      target: api
    environment:
      PORT: "3000"
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
      PRESENCE_GRACE_MS: ${PRESENCE_GRACE_MS:-30000}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      target: web
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
