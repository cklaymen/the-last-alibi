services:
  api:
    build:
      context: .
      target: api
    environment:
      PORT: "3000"
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
      PRESENCE_GRACE_MS: ${PRESENCE_GRACE_MS:-30000}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      target: web
    # Bound to localhost only: from outside the app is reachable just through the tunnel.
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Cloudflare Tunnel; started only with `--profile tunnel`.
  # In the Cloudflare dashboard set the Public Hostname service to: http://web:80
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - web
    restart: unless-stopped
    profiles: ["tunnel"]
